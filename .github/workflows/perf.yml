name: perf

on:
  pull_request:
    paths:
      - "engine/**"
      - "packages/pixel/src/**"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ${{ vars.PERF_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - name: Check out this change
        uses: actions/checkout@v4
        with:
          path: pixel
          fetch-depth: 0
      - name: Check out terminal-browser
        uses: actions/checkout@v4
        with:
          repository: zenbu-labs/terminal-browser
          path: terminal-browser
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pixel/engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the instrumented Ghostty
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download perf-latest -R zenbu-labs/ghostty -p Ghostty-perf.zip -D "$RUNNER_TEMP"
          ditto -x -k "$RUNNER_TEMP/Ghostty-perf.zip" "$RUNNER_TEMP/ghostty"
          echo "GHOSTTY_APP=$RUNNER_TEMP/ghostty/Ghostty.app" >> "$GITHUB_ENV"
      - name: Build this change's engine
        working-directory: pixel
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @zenbu-labs/pixel build
          pnpm --filter @zenbu-labs/pixel build:native -- --release
          cp packages/native/darwin-arm64/pixel.node "$RUNNER_TEMP/new.node"
      - name: Build the merge base's engine
        working-directory: pixel
        run: |
          base=$(git merge-base origin/${{ github.base_ref || 'main' }} HEAD)
          git worktree add "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base/engine" && cargo build --release -p pixel-node)
          cp "$RUNNER_TEMP/base/engine/target/release/libpixel_node.dylib" "$RUNNER_TEMP/old.node"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Build terminal-browser and the bench
        working-directory: terminal-browser
        run: |
          pnpm install
          pnpm -r build
          cc -O2 -o bench/native/rusage bench/native/rusage.c
      - name: Run the interleaved comparison
        id: ab
        working-directory: terminal-browser/bench
        run: |
          node dist/ab.js --old "$RUNNER_TEMP/old.node" --new "$RUNNER_TEMP/new.node" --rounds 3 \
            --seconds 5 --states 0 --chrome --translucent --app "$GHOSTTY_APP" --out "$RUNNER_TEMP/perf"
      - name: Write the comment
        if: always()
        run: |
          {
            echo "### perf: this change vs \`${BASE_SHA:0:7}\`"
            echo
            cat "$RUNNER_TEMP/perf/ab.md" 2>/dev/null || echo "the benchmark did not produce a report"
          } > "$RUNNER_TEMP/comment.md"
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          header: perf
          path: ${{ runner.temp }}/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: |
            ${{ runner.temp }}/perf/**/*.json
            ${{ runner.temp }}/perf/**/*.md
            ${{ runner.temp }}/perf/**/*.png
          if-no-files-found: ignore
